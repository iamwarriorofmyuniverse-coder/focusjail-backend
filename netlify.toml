[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Enforce strict HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Prevent clickjacking / unauthorized iframe embedding
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Cross-site scripting filter protection
    X-XSS-Protection = "1; mode=block"
    # Protect user privacy across navigation links
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Lock down device hardware access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Enterprise Content Security Policy
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://us.i.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://us.i.posthog.com; worker-src 'self' blob:;"
